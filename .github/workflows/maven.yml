name: Compilar Java Personalizado

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compilar y ejecutar archivo
      run: |
        # Busca el archivo camilo-suarez0.java modificado más recientemente
        LATEST_JAVA=$(find . -name "camilo-suarez0.java" -printf '%T@ %p\n' | sort -n | tail -1 | cut -f2- -d" ")
        
        # Compila y ejecuta únicamente ese archivo
        javac "$LATEST_JAVA"
        DIR_PATH=$(dirname "$LATEST_JAVA")
        java -cp "$DIR_PATH" camilo_suarez0
